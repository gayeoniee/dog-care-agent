<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dog-care-agent</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1f1d1a; --muted:#6b675f; --line:#e6e1d6;
          --ok:#1e7f4f; --bad:#b3261e; --warn:#9a6700; --accent:#2f5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:#faf8f3; }
  .chip.demo { border-color:var(--warn); color:var(--warn); }
  .chip.ok { border-color:var(--ok); color:var(--ok); }
  .chip.bad { border-color:var(--bad); color:var(--bad); }
  main { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  @media (max-width:860px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .panel h2 { font-size:13px; letter-spacing:.02em; color:var(--muted); margin:0 0 10px; text-transform:uppercase; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:26px 12px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #stage { position:relative; display:none; margin-top:10px; user-select:none; touch-action:none; }
  #stage canvas { width:100%; display:block; border-radius:8px; }
  #box { position:absolute; border:2px solid #17b3ff; box-shadow:0 0 0 9999px rgba(0,0,0,.28); cursor:move; }
  #box .h { position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; background:#17b3ff; border-radius:3px; cursor:nwse-resize; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .hint b { color:var(--ink); }
  #chat { display:flex; flex-direction:column; gap:12px; min-height:360px; max-height:64vh; overflow:auto; padding-right:4px; }
  .msg { max-width:92%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:#e8eef5; }
  .msg.bot { align-self:flex-start; background:#f3f1ea; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .card { margin-top:8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; }
  .bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .gate { border-left:3px solid var(--bad); padding-left:8px; color:var(--bad); font-size:13px; margin-top:6px; }
  .composed { border-left:3px solid var(--warn); padding-left:8px; color:var(--warn); font-size:13px; margin-top:6px; }
  details { margin-top:6px; font-size:12px; }
  pre { max-height:320px; overflow:auto; background:#fafafa; padding:8px; border-radius:6px; font-size:11.5px; }
  #progress { font-size:13px; color:var(--muted); min-height:20px; margin:8px 0; }
  #progress .steps span { margin-right:10px; opacity:.45; }
  #progress .steps span.on { opacity:1; color:var(--accent); font-weight:600; }
  form { display:flex; gap:8px; margin-top:8px; }
  input[type=text] { flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:6px 10px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🐕 dog-care-agent</h1>
  <span id="c-demo" class="chip demo" hidden>데모 모드 — 스텁 서브에이전트</span>
  <span id="c-sub" class="chip">연결 확인 중…</span>
  <span id="c-model" class="chip"></span>
  <span id="c-stats" class="chip" title="이 서버의 traces/ 집계 — 첫 초안이 게이트에 걸린 횟수"></span>
</header>
<main>
  <section class="panel">
    <h2>피부 사진 (선택)</h2>
    <div id="drop">사진을 끌어다 놓거나 클릭해서 고르세요<input id="file" type="file" accept="image/*" hidden></div>
    <div id="stage"><canvas id="cv"></canvas><div id="box"><div class="h"></div></div></div>
    <div class="hint" id="boxhint"></div>
    <div class="hint">네모를 <b>병변에 맞춰 끌고 늘리세요.</b> 1단계는 네모의 <b>중심</b>을, 2단계는 <b>크기</b>를 씁니다 — 크기가 틀리면 판정이 조용히 달라집니다.</div>
    <div style="margin-top:8px"><button type="button" class="ghost" id="clear" hidden>사진 지우기</button></div>
  </section>
  <section class="panel">
    <h2>상담</h2>
    <div id="chat"></div>
    <div id="progress"></div>
    <form id="f"><input id="q" type="text" placeholder="예) 산책할 때 줄을 너무 당겨요 / 여기 좀 봐주세요" autocomplete="off"><button id="send">보내기</button></form>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let session = "", file = null, img = null, box = null; // box: normalized [x,y,w,h]

fetch("/api/health").then((r) => r.json()).then((h) => {
  $("#c-demo").hidden = !h.demo;
  $("#c-sub").textContent = h.subagents.length ? "서브에이전트: " + h.subagents.join(", ") : "서브에이전트 없음";
  $("#c-sub").className = "chip " + (h.subagents.length === 2 ? "ok" : "bad");
  $("#c-model").textContent = h.model;
});
// 이 서버가 지금까지 뭘 막았나 — 게이트가 장식이 아니라는 걸 화면이 직접 말한다.
async function refreshStats() {
  try {
    const s = await fetch("/api/stats").then((r) => r.json());
    const el = $("#c-stats");
    if (!s.turns) { el.textContent = "기록 0턴"; return; }
    const hits = Object.entries(s.gate_hits || {}).map(([g, n]) => g + " " + n).join(" · ");
    el.textContent = `기록 ${s.turns}턴 · 게이트 걸림 ${s.first_pass_hit} (고침 ${s.repaired} · 조립 ${s.composed})` + (hits ? " · " + hits : "");
  } catch (_) { /* 통계는 있으면 좋고 없어도 된다 */ }
}
refreshStats();

// ── 사진 + 가이드 프레임 ─────────────────────────────
const drop = $("#drop"), fin = $("#file"), stage = $("#stage"), cv = $("#cv"), bx = $("#box");
drop.onclick = () => fin.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
fin.onchange = () => fin.files[0] && load(fin.files[0]);
$("#clear").onclick = () => { file = null; img = null; box = null; stage.style.display = "none"; $("#clear").hidden = true; $("#boxhint").textContent = ""; };
function load(f) {
  file = f; const u = URL.createObjectURL(f); img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(u);
    cv.width = img.width; cv.height = img.height; cv.getContext("2d").drawImage(img, 0, 0);
    stage.style.display = "block"; $("#clear").hidden = false; box = [0.3, 0.3, 0.4, 0.4]; place();
  };
  img.src = u;
}
function place() {
  const r = cv.getBoundingClientRect(); const [x, y, w, h] = box;
  bx.style.left = x * r.width + "px"; bx.style.top = y * r.height + "px";
  bx.style.width = w * r.width + "px"; bx.style.height = h * r.height + "px";
  $("#boxhint").innerHTML = "가이드 프레임 <b>" + box.map((v) => v.toFixed(2)).join(", ") + "</b> (x, y, w, h · 0~1)";
}
let drag = null;
bx.addEventListener("pointerdown", (e) => {
  e.preventDefault(); const r = cv.getBoundingClientRect();
  drag = { mode: e.target.classList.contains("h") ? "size" : "move", sx: e.clientX, sy: e.clientY, b: [...box], r };
  bx.setPointerCapture(e.pointerId);
});
bx.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / drag.r.width, dy = (e.clientY - drag.sy) / drag.r.height;
  let [x, y, w, h] = drag.b;
  if (drag.mode === "move") { x = Math.min(Math.max(0, x + dx), 1 - w); y = Math.min(Math.max(0, y + dy), 1 - h); }
  else { w = Math.min(Math.max(0.05, w + dx), 1 - x); h = Math.min(Math.max(0.05, h + dy), 1 - y); }
  box = [x, y, w, h]; place();
});
bx.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("resize", () => box && place());

// ── 상담 ──────────────────────────────────────────────
const chat = $("#chat"), prog = $("#progress");
const STEPS = { llm: "모델이 툴 고르는 중", tool: "서브에이전트 호출", gate: "게이트 검사", repair: "고쳐 쓰는 중", compose: "코드가 조립", done: "완료" };
function add(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  add("user", q + (file ? "\n📷 " + file.name : "")); $("#q").value = ""; $("#send").disabled = true;
  const fd = new FormData(); fd.append("question", q); fd.append("session_id", session);
  if (file) { fd.append("image", file); fd.append("box", box.map((v) => v.toFixed(4)).join(",")); }
  prog.innerHTML = '<div class="steps">' + Object.entries(STEPS).map(([k, v]) => '<span data-k="' + k + '">' + v + "</span>").join("") + '</div><div id="pline"></div>';
  const t0 = Date.now();
  try {
    const r = await fetch("/api/ask", { method: "POST", body: fd });
    if (!r.ok) { add("bot", "오류: " + await r.text()); return; }
    const { job_id, session_id } = await r.json(); session = session_id;
    await new Promise((res, rej) => {
      const es = new EventSource("/api/events/" + job_id);
      es.addEventListener("progress", (ev) => {
        const d = JSON.parse(ev.data);
        prog.querySelectorAll(".steps span").forEach((s) => s.classList.toggle("on", s.dataset.k === d.kind));
        let line = STEPS[d.kind] || d.kind;
        if (d.name) line += " · " + d.name;
        if (d.round) line += " · 왕복 " + d.round;
        if (d.violations) line += " · 걸림: " + d.violations.join(" / ");
        $("#pline").textContent = line + "  (" + ((Date.now() - t0) / 1000).toFixed(0) + "s)";
      });
      es.addEventListener("result", (ev) => { es.close(); render(JSON.parse(ev.data)); res(); });
      es.onerror = () => { es.close(); rej(new Error("연결 끊김")); };
    });
  } catch (err) { add("bot", "오류: " + err.message); }
  finally { $("#send").disabled = false; prog.innerHTML = ""; }
};

function render(r) {
  if (r.error) { add("bot", "오류: " + r.error); return; }
  const d = add("bot", r.answer);
  const meta = document.createElement("div"); meta.className = "meta";
  meta.innerHTML = r.calls.map((c) => '<span class="chip ' + (c.error ? "bad" : "") + '">' + esc(c.name) + " " + Math.round(c.elapsed_ms) + "ms</span>").join("")
    + '<span class="chip">왕복 ' + r.rounds + " · " + (r.elapsed_ms / 1000).toFixed(1) + "s</span>"
    + '<span class="chip ' + (r.violations.length ? "bad" : "ok") + '">게이트 ' + (r.violations.length ? "위반 " + r.violations.length : "통과") + "</span>";
  d.appendChild(meta);
  if (r.composed) { const c = document.createElement("div"); c.className = "composed"; c.textContent = "※ 이 답은 LLM 이 아니라 코드가 조립했습니다 — 게이트가 두 번 걸렸습니다."; d.appendChild(c); }
  r.violations.forEach((v) => { const g = document.createElement("div"); g.className = "gate"; g.textContent = "⛔ " + v; d.appendChild(g); });
  Object.entries(r.subagent_failures || {}).forEach(([k, why]) => { const g = document.createElement("div"); g.className = "composed"; g.textContent = "※ 서브에이전트 " + k + " 는 붙지 않은 채 답했습니다 — " + why; d.appendChild(g); });
  if (r.screening) {
    const s = r.screening; const c = document.createElement("div"); c.className = "card";
    let html = "<b>피부 판정</b> " + esc(s.verdict) + " · 이상 " + (s.abnormal_percent ?? "–") + "% · 앙상블 " + (s.arms ?? "?") + "팔" + (s.demo ? ' <span class="chip demo">스텁</span>' : "");
    html += s.group ? '<div style="margin-top:4px">계열: <b>' + esc(s.group) + "</b> " + s.group_percent + "%</div>"
                    : '<div style="margin-top:4px;color:var(--muted)">계열 없음 — 확신이 낮아 말하지 않습니다</div>';
    html += s.groups.map((g) => '<div style="margin-top:4px">' + esc(g.name) + ' <span style="color:var(--muted)">' + g.percent + '%</span><div class="bar"><i style="width:' + g.percent + '%"></i></div></div>').join("");
    c.innerHTML = html; d.appendChild(c);
  }
  const det = document.createElement("details");
  det.innerHTML = "<summary>기록 보기 (" + esc(r.trace) + ")</summary><pre>불러오는 중…</pre>";
  det.addEventListener("toggle", async () => {
    if (det.open) { const t = await fetch("/api/trace/" + r.trace + "?session_id=" + encodeURIComponent(session)).then((x) => x.json()); det.querySelector("pre").textContent = JSON.stringify(t, null, 2); }
  }, { once: true });
  d.appendChild(det); chat.scrollTop = chat.scrollHeight;
  refreshStats();
}
</script>
</body>
</html>
