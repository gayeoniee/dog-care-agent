[project]
name = "dog-care-agent"
version = "0.1.0"
description = "반려견 상담 오케스트레이터 — 근거 RAG와 피부 스크리닝 모델을 MCP 서브에이전트로 두고, 모델이 말해도 되는 것을 코드가 정한다"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
dogcare = "dogcare.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dogcare"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 명시적으로 고릅니다. 기본값은 ruff 버전마다 달라져서, 어제 통과하던 게
# 오늘 깨집니다 (실제로 C408·PYI 가 갑자기 켜졌습니다).
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",   # 전각 문장부호(·, —)를 쓴다. 한글 문서에서 정상이다
    "RUF002",
    "RUF003",
]
