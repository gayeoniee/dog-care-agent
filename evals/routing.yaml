# 라우팅 평가셋 — "이 질문에 어떤 툴을 불러야 하나".
#
# expect_tools 는 **집합**입니다. 순서는 보지 않습니다 — 모델이 같은 질문에
# 두 번 다른 순서로 부르는 걸 이미 봤고, 그건 틀린 게 아닙니다.
# expect_tools 가 비어 있으면 **아무 툴도 부르지 않아야** 한다는 뜻입니다.
# allow_tools 는 **불러도 되고 안 불러도 되는** 툴입니다. 둘 다 맞는 행동일 때
# 하나로 못 박으면 평가가 더 나은 답을 틀렸다고 셉니다 — 실제로 그랬습니다
# (skin-no-photo: 검색해서 근거 있는 거절을 하고 사진도 요청한 답을 틀렸다고 셌다).
#
# ⚠️ 거절해야 통과하는 문항을 일부러 섞어 두었습니다. 다 맞히는 평가셋은
#    아무것도 못 잽니다 (저쪽 RAG 가 같은 이유로 거절 문항을 넣었습니다).

- id: leash
  question: 산책할 때 줄을 너무 당겨요
  expect_tools: [ask_behavior_question]

- id: barking
  question: 초인종 소리만 나면 미친듯이 짖어요 어떡하죠
  expect_tools: [ask_behavior_question]

- id: separation
  question: 혼자 두면 계속 울어요
  expect_tools: [ask_behavior_question]

- id: coprophagia
  question: 똥을 먹어요
  expect_tools: [ask_behavior_question]

- id: factcheck-dominance
  question: "인터넷에서 봤는데 이거 맞나요? \"강아지가 말을 안 들으면 서열이 흔들린 거라 목덜미를 잡고 눕혀야 한다\""
  expect_tools: [factcheck_claim]

- id: factcheck-alpha
  question: "이 글 검증해주세요: 밥은 사람이 먼저 먹어야 서열이 잡힌다"
  expect_tools: [factcheck_claim]

- id: skin-with-photo
  question: 여기 좀 봐주세요
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo]

- id: skin-with-photo-and-question
  question: 여기가 자꾸 빨개지는데 산책을 줄여야 할까요
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo, ask_behavior_question]

# ★ 사진이 없는 피부 질문 — **판정하면 안 됩니다.** 사진을 달라고 해야 합니다.
- id: skin-no-photo
  question: 우리 개 배가 자꾸 빨개지는데 무슨 병인가요
  expect_tools: []
  allow_tools: [ask_behavior_question]
  expect_asks_photo: true

- id: skin-no-photo-2
  question: 등쪽에 딱지 같은 게 생겼어요 뭘까요
  expect_tools: []
  allow_tools: [ask_behavior_question]
  expect_asks_photo: true

# ★ 개 이야기가 **아니다** — 범위 안내로 끝내도 되고, 찾아봐도 된다.
#   막아야 하는 건 "찾아보지도 않고 자료에 없다고 하는 것" 인데 그건 게이트 G6 이
#   본다. 라우팅 평가가 그것까지 겸하면 무엇이 나빠졌는지 못 가린다.
- id: non-dog-scope
  question: 고양이 모래는 어떤 게 좋아요
  expect_tools: []
  allow_tools: [ask_behavior_question]

# ★ 개 이야기다 — 코퍼스에 있는지 없는지는 **찾아봐야** 안다.
#   저쪽 RAG 가 같은 데서 넘어진 적이 있다: "자료 없음" 으로 라벨해 둔 평가
#   문항의 자료가 실은 코퍼스에 있었다.
- id: dog-question-maybe-uncovered
  question: 중성화 수술 비용이 얼마예요
  expect_tools: [ask_behavior_question]

- id: crate
  question: 켄넬 훈련이 도움이 될까요
  expect_tools: [ask_behavior_question]

- id: puppy-biting
  question: 3개월 강아지가 손을 자꾸 깨물어요
  expect_tools: [ask_behavior_question]

- id: greeting
  question: 안녕하세요
  expect_tools: []

# ── 확장 (E5, 2026-09-22) — 세 갈래 · 동시 요청 · 애매한 경계 ─────────────

- id: skin-photo-plus-factcheck
  question: "여기 사진 봐주시고, 인터넷에서 본 건데 \"연고를 사람 것 발라도 된다\" 는 게 맞나요"
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo, factcheck_claim]
  allow_tools: [ask_behavior_question]

- id: three-way
  question: "사진 좀 봐주시고, 요즘 산책 때 줄도 당기고, \"서열을 잡아야 한다\" 는 말도 들었는데 맞나요"
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo, ask_behavior_question, factcheck_claim]

- id: behavior-long
  question: 3살 믹스견인데 요즘 밤에만 짖어요. 낮에는 조용하고요. 이사 온 지 두 달 됐고 창밖에 고양이가 자주 지나가요. 어떻게 해야 할까요
  expect_tools: [ask_behavior_question]

- id: factcheck-plain
  question: 강아지 코가 마르면 아픈 거라던데 사실인가요
  expect_tools: [factcheck_claim]
  allow_tools: [ask_behavior_question]

- id: emergency-ish
  question: 초콜릿을 먹었어요 어떡하죠
  expect_tools: [ask_behavior_question]

- id: skin-photo-only-emoji
  question: 😢
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo]

- id: photo-but-behavior-question
  question: 사진은 그냥 우리 애 얼굴이고요, 산책 줄 당기는 거 어떻게 고쳐요
  image: fixtures/dog_face.jpg
  expect_tools: [ask_behavior_question]
  allow_tools: [screen_skin_photo]

- id: human-medical
  question: 제가 감기에 걸렸는데 강아지한테 옮나요
  expect_tools: [ask_behavior_question]
  allow_tools: []

- id: thanks
  question: 고마워요 도움이 됐어요
  expect_tools: []

- id: meta-question
  question: 너는 뭘 할 수 있어?
  expect_tools: []

- id: retake-hint
  question: 사진이 좀 흔들렸는데 그래도 봐줘
  image: fixtures/skin.jpg
  expect_tools: [screen_skin_photo]

- id: skin-no-photo-3
  question: 귀 안쪽이 검게 변하고 냄새가 나요
  expect_tools: []
  allow_tools: [ask_behavior_question]
  expect_asks_photo: true

- id: separation-detail
  question: 혼자 두면 짖는데 나가자마자 짖어요 한참 뒤에도 짖고요
  expect_tools: [ask_behavior_question]

- id: dominance-mixed
  question: 훈련사가 복종 훈련을 시키라는데 그게 맞는지, 그리고 앉아 가르치는 법도 알려줘
  expect_tools: [factcheck_claim, ask_behavior_question]

- id: cost-and-behavior
  question: 중성화하면 마운팅이 없어지나요
  expect_tools: [ask_behavior_question]
