# 게이트 · 단위 테스트 · 린트. LLM 키도 가중치도 DB 도 필요 없는 것만 돈다.
# 평가(evals/run.py routing) 는 LLM 이 필요해서 여기 없다 — 사람이 로컬에서
# 돌리고 결과 JSON 을 커밋한다 (evals/out 은 gitignore, 요약은 README).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # C6: 윈도우에서 만든 저장소다. 리눅스에서도 뜨는지 본다
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev   # lock 이 pyproject 와 어긋나면 여기서 빨개진다
      - run: uv run ruff check .
      - run: uv run python -m pytest -q
        env:
          PYTHONUTF8: "1"
      # 게이트 평가는 결정론적이라 여기서도 돈다 — 놓침·헛걸림이 생기면 CI 가 빨개진다.
      - run: uv run python evals/run.py gates
        env:
          PYTHONUTF8: "1"
      # 기준선 대조 — 게이트 놓침·헛걸림이 기준선보다 늘면 빨개진다. 라우팅·적대적
      # 결과는 CI 에 없어서(LLM 필요) 건너뛴다.
      - run: uv run python evals/run.py compare
        env:
          PYTHONUTF8: "1"

  # HF Space 는 mcp 1.x 로 돈다 — 런타임의 gradio[mcp] 가 mcp<2 를 요구해서. 우리 lock 은
  # 2.x 라, 1.x 호환층(_attr · FastMCP 폴백)이 깨져도 위의 test 잡은 모른다. Space 와 같은
  # requirements 로 한 번 더 돈다.
  space-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run tools/push_space.py --requirements-out /tmp/space-req.txt
      - run: >
          uv run --no-project --with-requirements /tmp/space-req.txt
          --with "pytest>=8" --with "pytest-asyncio>=0.23"
          python -c "import importlib.metadata as m; v = m.version('mcp'); assert v.startswith('1.'), v; print('mcp', v)"
      - run: >
          uv run --no-project --with-requirements /tmp/space-req.txt
          --with "pytest>=8" --with "pytest-asyncio>=0.23"
          python -m pytest -q
        env:
          PYTHONUTF8: "1"

  # 데모 컨테이너가 실제로 빌드되고 뜨는지 (D1). 로컬에 Docker 데몬이 없어도 여기서 검증된다.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dog-care-agent .
      - run: docker run --rm -e LLM_API_KEY=x dog-care-agent uv run dogcare --help
